<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - TendaRental Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #0b0f19;
      --bg-card: rgba(30, 41, 59, 0.65);
      --border-color: rgba(255, 255, 255, 0.1);
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --accent: #06b6d4;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #ef4444;
      --success: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: radial-gradient(circle at 80% 0%, #1e1b4b 0%, #0b0f19 70%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-container {
      background: var(--bg-card);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
      animation: slideUp 0.4s ease;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .login-header {
      text-align: center;
      margin-bottom: 32px;
    }

    .login-logo {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      margin: 0 auto 20px;
      box-shadow: 0 0 30px rgba(99, 102, 241, 0.5);
    }

    .login-title {
      font-family: 'Outfit', sans-serif;
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 8px;
      background: linear-gradient(to right, #ffffff, #cbd5e1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .login-subtitle {
      color: var(--text-muted);
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text-muted);
    }

    .form-control {
      width: 100%;
      background: rgba(11, 15, 25, 0.7);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 14px 16px;
      color: var(--text-main);
      font-size: 15px;
      outline: none;
      transition: all 0.2s;
    }

    .form-control:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
    }

    .form-control::placeholder {
      color: var(--text-muted);
      opacity: 0.6;
    }

    .btn {
      width: 100%;
      background: linear-gradient(135deg, var(--primary), var(--primary-hover));
      color: white;
      border: none;
      border-radius: 12px;
      padding: 14px 24px;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
      margin-top: 8px;
    }

    .btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.45);
    }

    .btn:active:not(:disabled) {
      transform: scale(0.98);
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: transparent;
      border: 1px solid var(--border-color);
      box-shadow: none;
    }

    .btn-secondary:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .divider {
      display: flex;
      align-items: center;
      margin: 24px 0;
      color: var(--text-muted);
      font-size: 12px;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border-color);
    }

    .divider::before {
      margin-right: 12px;
    }

    .divider::after {
      margin-left: 12px;
    }

    .alert {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: var(--danger);
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 13px;
      margin-bottom: 20px;
      display: none;
      animation: shake 0.3s ease;
    }

    .alert.show {
      display: block;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }

    .alert-success {
      background: rgba(16, 185, 129, 0.15);
      border-color: rgba(16, 185, 129, 0.3);
      color: var(--success);
    }

    .forgot-password {
      text-align: center;
      margin-top: 20px;
    }

    .forgot-password a {
      color: var(--accent);
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      transition: color 0.2s;
    }

    .forgot-password a:hover {
      color: var(--text-main);
    }

    .loading-spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .back-link {
      position: absolute;
      top: 20px;
      left: 20px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: color 0.2s;
    }

    .back-link:hover {
      color: var(--text-main);
    }

    @media (max-width: 480px) {
      .login-container {
        padding: 28px 24px;
      }

      .login-title {
        font-size: 24px;
      }

      .login-logo {
        width: 56px;
        height: 56px;
        font-size: 28px;
      }
    }
  </style>
</head>
<body>
  <a href="index.html" class="back-link" id="login-back-link">← Kembali ke Beranda</a>

  <div class="login-container">
    <div class="login-header">
      <div class="login-logo">🎪</div>
      <h1 class="login-title">TendaRental</h1>
      <p class="login-subtitle">Panel Admin & Manajemen</p>
    </div>

    <div id="alert-box" class="alert"></div>
    <div id="demo-mode-notice" class="alert alert-success" style="display: none;">
      Mode demo aktif. Perubahan hanya tersimpan pada project demo.
    </div>

    <form id="login-form">
      <div class="form-group">
        <label class="form-label" for="email">Alamat Email</label>
        <input 
          type="email" 
          class="form-control" 
          id="email" 
          placeholder="admin@example.com" 
          required 
          autocomplete="email"
        >
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Kata Sandi</label>
        <input 
          type="password" 
          class="form-control" 
          id="password" 
          placeholder="Masukkan kata sandi" 
          required 
          autocomplete="current-password"
        >
      </div>

      <button type="submit" class="btn" id="btn-login">
        Masuk ke Dashboard
      </button>
    </form>

    <div class="divider">atau</div>

    <button class="btn btn-secondary" id="btn-demo-login">
      🎭 Buka Demo Terpisah
    </button>

    <div class="forgot-password">
      <a href="#" id="btn-forgot-password">Lupa kata sandi?</a>
    </div>
  </div>

  <script type="module">
    import { loginUser, logoutUser, resetPassword, subscribeToAuthState } from './js/authService.js?v=demo-separation-20260930';
    import { isDemoMode, pageHref } from './js/demoMode.js?v=demo-separation-20260930';

    const loginForm = document.getElementById('login-form');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const btnLogin = document.getElementById('btn-login');
    const btnDemoLogin = document.getElementById('btn-demo-login');
    const btnForgotPassword = document.getElementById('btn-forgot-password');
    const alertBox = document.getElementById('alert-box');
    const demoModeNotice = document.getElementById('demo-mode-notice');
    const backLink = document.getElementById('login-back-link');
    if (demoModeNotice) demoModeNotice.style.display = isDemoMode ? 'block' : 'none';
    if (backLink) backLink.href = pageHref('index.html');
    btnDemoLogin.textContent = isDemoMode ? '🎭 Masuk dengan Akun Demo' : '🎭 Buka Demo Terpisah';

    function showAlert(message, type = 'error') {
      alertBox.textContent = message;
      alertBox.className = 'alert show' + (type === 'success' ? ' alert-success' : '');
      alertBox.style.display = 'block';
      
      setTimeout(() => {
        alertBox.style.display = 'none';
      }, 5000);
    }

    function setLoading(isLoading) {
      btnLogin.disabled = isLoading;
      btnDemoLogin.disabled = isLoading;
      
      if (isLoading) {
        btnLogin.innerHTML = '<span class="loading-spinner"></span>Memproses...';
      } else {
        btnLogin.textContent = 'Masuk ke Dashboard';
      }
    }

    subscribeToAuthState(async (user) => {
      if (user) {
        window.location.href = pageHref('index.html');
      }
    });

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (!email || !password) {
        showAlert('Mohon isi email dan kata sandi.');
        return;
      }

      setLoading(true);
      alertBox.style.display = 'none';

      try {
        await loginUser(email, password);
        showAlert('Login berhasil! Mengalihkan...', 'success');
        setTimeout(() => {
          window.location.href = pageHref('index.html');
        }, 1000);
      } catch (error) {
        console.error('Login error:', error);
        
        let errorMessage = 'Gagal login. ';
        
        if (error.code === 'auth/invalid-email') {
          errorMessage = 'Format email tidak valid.';
        } else if (error.code === 'auth/user-not-found') {
          errorMessage = 'Email tidak terdaftar.';
        } else if (error.code === 'auth/wrong-password') {
          errorMessage = 'Kata sandi salah.';
        } else if (error.code === 'auth/too-many-requests') {
          errorMessage = 'Terlalu banyak percobaan. Coba lagi nanti.';
        } else if (error.message) {
          errorMessage = error.message;
        }
        
        showAlert(errorMessage);
        setLoading(false);
      }
    });

    btnDemoLogin.addEventListener('click', async () => {
      if (!isDemoMode) {
        window.location.href = 'demo.html';
        return;
      }

      if (!emailInput.value.trim()) emailInput.value = 'demo@tendarental.id';
      passwordInput.focus();
      showAlert('Masukkan kata sandi akun demo yang dibuat di Firebase project demo.', 'success');
    });

    btnForgotPassword.addEventListener('click', async (e) => {
      e.preventDefault();
      
      const email = emailInput.value.trim();
      
      if (!email) {
        showAlert('Masukkan email terlebih dahulu untuk reset password.');
        emailInput.focus();
        return;
      }

      setLoading(true);

      try {
        await resetPassword(email);
        showAlert('Email reset password telah dikirim. Cek inbox Anda.', 'success');
      } catch (error) {
        console.error('Reset password error:', error);
        showAlert('Gagal mengirim email reset. Pastikan email sudah terdaftar.');
      } finally {
        setLoading(false);
      }
    });
  </script>
</body>
</html>
