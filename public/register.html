<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Registration - TendaRental</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #0b0f19;
      --bg-card: rgba(30, 41, 59, 0.65);
      --border-color: rgba(255, 255, 255, 0.1);
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --accent: #06b6d4;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #ef4444;
      --success: #10b981;
      --warning: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: radial-gradient(circle at 80% 0%, #1e1b4b 0%, #0b0f19 70%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: var(--bg-card);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 40px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
      animation: slideUp 0.4s ease;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .header {
      text-align: center;
      margin-bottom: 32px;
    }

    .logo {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      margin: 0 auto 20px;
      box-shadow: 0 0 30px rgba(99, 102, 241, 0.5);
    }

    .title {
      font-family: 'Outfit', sans-serif;
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 8px;
      background: linear-gradient(to right, #ffffff, #cbd5e1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text-muted);
    }

    .form-control {
      width: 100%;
      background: rgba(11, 15, 25, 0.7);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 14px 16px;
      color: var(--text-main);
      font-size: 15px;
      outline: none;
      transition: all 0.2s;
    }

    .form-control:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
    }

    .form-control::placeholder {
      color: var(--text-muted);
      opacity: 0.6;
    }

    .btn {
      width: 100%;
      background: linear-gradient(135deg, var(--primary), var(--primary-hover));
      color: white;
      border: none;
      border-radius: 12px;
      padding: 14px 24px;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
      margin-top: 8px;
    }

    .btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.45);
    }

    .btn:active:not(:disabled) {
      transform: scale(0.98);
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: transparent;
      border: 1px solid var(--border-color);
      box-shadow: none;
      color: var(--text-main);
    }

    .btn-secondary:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .alert {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: var(--danger);
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 13px;
      margin-bottom: 20px;
      display: none;
      animation: shake 0.3s ease;
    }

    .alert.show {
      display: block;
    }

    .alert.success {
      background: rgba(16, 185, 129, 0.15);
      border-color: rgba(16, 185, 129, 0.3);
      color: var(--success);
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }

    .loading-spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .info-box {
      background: rgba(99, 102, 241, 0.1);
      border: 1px solid rgba(99, 102, 241, 0.3);
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 20px;
    }

    .role-select {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 20px;
    }

    .role-option {
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 12px 14px;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
      font-size: 13px;
      font-weight: 600;
    }

    .role-option:hover {
      background: rgba(99, 102, 241, 0.1);
      border-color: rgba(99, 102, 241, 0.4);
    }

    .role-option.active {
      background: linear-gradient(135deg, var(--primary), var(--primary-hover));
      border-color: var(--primary);
      color: white;
    }

    .divider {
      text-align: center;
      margin: 24px 0;
      color: var(--text-muted);
      font-size: 12px;
    }

    .divider::before,
    .divider::after {
      content: '';
      display: inline-block;
      width: 40%;
      height: 1px;
      background: var(--border-color);
      vertical-align: middle;
    }

    .divider::before {
      margin-right: 8px;
    }

    .divider::after {
      margin-left: 8px;
    }

    .back-link {
      text-align: center;
      margin-top: 20px;
    }

    .back-link a {
      color: var(--accent);
      text-decoration: none;
      font-size: 14px;
      transition: color 0.2s;
    }

    .back-link a:hover {
      color: var(--text-main);
    }

    @media (max-width: 480px) {
      .container {
        padding: 28px 24px;
      }

      .title {
        font-size: 24px;
      }

      .role-select {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo">🎪</div>
      <h1 class="title">TendaRental</h1>
      <p class="subtitle">Tambah User Admin/Staff</p>
    </div>

    <div id="alert-box" class="alert"></div>

    <div class="info-box">
      ⚠️ Halaman ini hanya untuk menambahkan user admin dan staff. Pastikan Anda memiliki akses administrasi yang tepat.
    </div>

    <form id="register-form">
      <div class="form-group">
        <label class="form-label" for="nama">Nama Lengkap</label>
        <input 
          type="text" 
          class="form-control" 
          id="nama" 
          placeholder="Contoh: Budi Santoso" 
          required
        >
      </div>

      <div class="form-group">
        <label class="form-label" for="email">Alamat Email</label>
        <input 
          type="email" 
          class="form-control" 
          id="email" 
          placeholder="admin@example.com" 
          required
        >
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Kata Sandi (min 8 karakter)</label>
        <input 
          type="password" 
          class="form-control" 
          id="password" 
          placeholder="Masukkan kata sandi aman" 
          minlength="8"
          required
        >
      </div>

      <div class="form-group">
        <label class="form-label" for="password-confirm">Konfirmasi Kata Sandi</label>
        <input 
          type="password" 
          class="form-control" 
          id="password-confirm" 
          placeholder="Ulangi kata sandi" 
          minlength="8"
          required
        >
      </div>

      <div class="form-group">
        <small class="form-label">Registrasi mandiri membuat akun Staff. Role Admin dan Pekerja hanya dapat dibuat oleh Admin.</small>
      </div>

      <button type="submit" class="btn" id="btn-register">
        ➕ Tambah User
      </button>
    </form>

    <div class="divider">atau</div>

    <button class="btn btn-secondary" id="btn-back" onclick="window.location.href='login.html'">
      ← Kembali ke Login
    </button>

    <div class="back-link">
      <a href="index.html">← Kembali ke Beranda</a>
    </div>
  </div>

  <script type="module">
    import { registerUser, subscribeToAuthState } from './js/authService.js?v=role-admin-20260930';

    const registerForm = document.getElementById('register-form');
    const namaInput = document.getElementById('nama');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const passwordConfirmInput = document.getElementById('password-confirm');
    const btnRegister = document.getElementById('btn-register');
    const alertBox = document.getElementById('alert-box');

    subscribeToAuthState((user) => {
      if (user) {
        window.location.href = 'index.html';
      }
    });

    function showAlert(message, type = 'error') {
      alertBox.textContent = message;
      alertBox.className = 'alert show' + (type === 'success' ? ' success' : '');
      alertBox.style.display = 'block';
      
      setTimeout(() => {
        alertBox.style.display = 'none';
      }, 5000);
    }

    function setLoading(isLoading) {
      btnRegister.disabled = isLoading;
      
      if (isLoading) {
        btnRegister.innerHTML = '<span class="loading-spinner"></span>Membuat User...';
      } else {
        btnRegister.textContent = '➕ Tambah User';
      }
    }

    registerForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const nama = namaInput.value.trim();
      const email = emailInput.value.trim();
      const password = passwordInput.value;
      const passwordConfirm = passwordConfirmInput.value;
      if (!nama || !email || !password) {
        showAlert('Mohon isi semua field.');
        return;
      }

      if (password !== passwordConfirm) {
        showAlert('Kata sandi tidak cocok.');
        return;
      }

      if (password.length < 8) {
        showAlert('Kata sandi minimal 8 karakter.');
        return;
      }

      setLoading(true);
      alertBox.style.display = 'none';

      try {
        await registerUser(email, password, nama);
        showAlert(`User berhasil dibuat! Email: ${email}`, 'success');
        registerForm.reset();
        
        setTimeout(() => {
          window.location.href = 'login.html';
        }, 2000);
      } catch (error) {
        console.error('Register error:', error);
        
        let errorMessage = 'Gagal membuat user. ';
        
        if (error.code === 'auth/email-already-in-use') {
          errorMessage = 'Email sudah terdaftar.';
        } else if (error.code === 'auth/weak-password') {
          errorMessage = 'Kata sandi terlalu lemah.';
        } else if (error.code === 'auth/invalid-email') {
          errorMessage = 'Format email tidak valid.';
        } else if (error.message) {
          errorMessage = error.message;
        }
        
        showAlert(errorMessage);
        setLoading(false);
      }
    });
  </script>
</body>
</html>
